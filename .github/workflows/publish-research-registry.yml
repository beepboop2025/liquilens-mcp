name: Publish source-data MCP Registry entry

# The official MCP Registry authenticates this repo's identity through
# GitHub's OIDC token (mcp-publisher login github-oidc), so no secret is
# created, stored or pasted anywhere. Publishes whatever version the
# committed server.json carries. PulseMCP re-ingests the official registry
# weekly and Glama syncs connectors from it, so landing here propagates to
# those directories for free.
#
# The publisher binary is version-pinned and sha256-verified: this job
# holds an OIDC id-token, so executing an unpinned "latest" download here
# would hand namespace publish rights to whoever controls the next
# release. Bump the version and hash together, from
# registry_<ver>_checksums.txt on the release.
#
# Run it with: gh workflow run publish-research-registry.yml

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  mcp-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher (pinned + checksum-verified)
        run: |
          # -f so an HTTP error is an error: without it curl writes the
          # 404 page into the tarball and the next line reports a checksum
          # mismatch, which on a supply-chain-pinned download reads as
          # tampering rather than as a bad URL. --proto/--tlsv1.2 keep a
          # redirect from downgrading the transport.
          curl -fsSLo mcp-publisher.tar.gz \
            --proto '=https' --tlsv1.2 \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Verify the declared public runtime before publication
        run: |
          python3 - <<'PYTHON'
          import json, urllib.request
          manifest = json.load(open('research-data-server.json'))
          endpoint = manifest['remotes'][0]['url']
          payload = {'jsonrpc':'2.0','id':1,'method':'initialize','params':{
              'protocolVersion':'2025-11-25','capabilities':{},
              'clientInfo':{'name':'codex-release-verification','version':'1'}}}
          request = urllib.request.Request(endpoint, data=json.dumps(payload).encode(), headers={
              'Content-Type':'application/json','Accept':'application/json, text/event-stream',
              'X-Liquilens-Traffic-Class':'synthetic'})
          with urllib.request.urlopen(request, timeout=20) as response:
              body=json.load(response)
          assert body['result']['serverInfo']['version'] == manifest['version']
          assert body['result']['protocolVersion'] == '2025-11-25'
          print('Public runtime matches registry manifest')
          PYTHON

      - name: Authenticate by OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish research-data-server.json
